<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SmartDataQuery · 智能数据查询</title>
<style>
  :root {
    --bg: #f5f7fb;
    --panel: #ffffff;
    --ink: #17233d;
    --ink-soft: #5b6b8c;
    --line: #e4e9f2;
    --brand: #2f6df6;
    --brand-soft: #eaf1ff;
    --ok: #12b76a;
    --err: #f04438;
    --warn: #f79009;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(16, 30, 54, .04), 0 8px 24px rgba(16, 30, 54, .06);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1120px;
    margin: 0 auto;
    padding: 28px 20px 64px;
  }

  /* ---------- 顶部 ---------- */
  header.top {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 26px;
  }

  .logo {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, #2f6df6, #6f9dff);
    display: grid; place-items: center;
    color: #fff; font-weight: 700; font-size: 19px;
    box-shadow: 0 6px 16px rgba(47, 109, 246, .28);
    flex: none;
  }

  .title h1 {
    margin: 0;
    font-size: 19px;
    font-weight: 650;
    letter-spacing: .2px;
  }

  .title p {
    margin: 3px 0 0;
    font-size: 13px;
    color: var(--ink-soft);
  }

  /* ---------- 提问区 ---------- */
  .asker {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  textarea#query {
    flex: 1;
    resize: none;
    min-height: 54px;
    max-height: 180px;
    padding: 14px 15px;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: #fbfcfe;
    color: var(--ink);
    font-size: 14.5px;
    line-height: 1.5;
    font-family: inherit;
    outline: none;
    transition: border-color .16s, background .16s, box-shadow .16s;
  }

  textarea#query:focus {
    border-color: var(--brand);
    background: #fff;
    box-shadow: 0 0 0 3px var(--brand-soft);
  }

  textarea#query::placeholder { color: #9aa7bf; }

  button.send {
    flex: none;
    height: 54px;
    padding: 0 26px;
    border: 0;
    border-radius: 11px;
    background: var(--brand);
    color: #fff;
    font-size: 14.5px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background .16s, transform .06s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  button.send:hover:not(:disabled) { background: #2560e0; }
  button.send:active:not(:disabled) { transform: translateY(1px); }
  button.send:disabled { background: #b9c8e8; cursor: not-allowed; }

  .spinner {
    width: 15px; height: 15px;
    border: 2px solid rgba(255,255,255,.45);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    display: none;
  }

  button.send.loading .spinner { display: block; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .examples {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
    align-items: center;
  }

  .examples .label {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-right: 2px;
  }

  .chip {
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink-soft);
    border-radius: 999px;
    padding: 6px 13px;
    font-size: 12.5px;
    cursor: pointer;
    font-family: inherit;
    transition: all .16s;
  }

  .chip:hover {
    border-color: #c3d4f7;
    background: var(--brand-soft);
    color: var(--brand);
  }

  /* ---------- 主体两栏 ---------- */
  .grid {
    display: grid;
    grid-template-columns: 330px minmax(0, 1fr);
    gap: 18px;
    margin-top: 18px;
    align-items: start;
  }

  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 18px;
    border-bottom: 1px solid var(--line);
  }

  .card-head h2 {
    margin: 0;
    font-size: 14px;
    font-weight: 650;
    letter-spacing: .2px;
  }

  .badge {
    font-size: 12px;
    color: var(--ink-soft);
    background: #f2f5fb;
    border-radius: 999px;
    padding: 3px 10px;
  }

  /* ---------- 步骤 ---------- */
  ol.steps {
    list-style: none;
    margin: 0;
    padding: 8px 10px 14px;
  }

  ol.steps li {
    position: relative;
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 9px 8px;
    font-size: 13.5px;
    color: #9aa7bf;
    border-radius: 9px;
    transition: color .16s, background .16s;
  }

  ol.steps li.running {
    color: var(--ink);
    background: var(--brand-soft);
    font-weight: 600;
  }

  ol.steps li.success { color: var(--ink); }

  ol.steps li.error { color: var(--err); font-weight: 600; }

  .dot {
    flex: none;
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 2px solid #dfe5f0;
    background: #fff;
    display: grid;
    place-items: center;
    font-size: 11px;
    color: #fff;
    transition: all .18s;
  }

  li.running .dot {
    border-color: var(--brand);
    border-top-color: transparent;
    animation: spin .7s linear infinite;
  }

  li.success .dot {
    border-color: var(--ok);
    background: var(--ok);
  }

  li.error .dot {
    border-color: var(--err);
    background: var(--err);
  }

  li .txt { flex: 1; }

  /* ---------- 结果 ---------- */
  .result-body {
    padding: 16px 18px 20px;
  }

  .empty {
    padding: 46px 20px;
    text-align: center;
    color: #9aa7bf;
    font-size: 13.5px;
    line-height: 1.9;
  }

  .empty svg { opacity: .38; margin-bottom: 10px; }

  .table-scroll {
    overflow: auto;
    max-height: 62vh;
    border: 1px solid var(--line);
    border-radius: 10px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
    white-space: nowrap;
  }

  thead th {
    position: sticky;
    top: 0;
    z-index: 1;
    background: #f7f9fd;
    color: var(--ink-soft);
    text-align: left;
    font-weight: 600;
    padding: 11px 14px;
    border-bottom: 1px solid var(--line);
    font-size: 12.5px;
    letter-spacing: .2px;
  }

  tbody td {
    padding: 10px 14px;
    border-bottom: 1px solid #f0f3f9;
    color: var(--ink);
  }

  tbody tr:nth-child(even) { background: #fbfcfe; }
  tbody tr:hover { background: var(--brand-soft); }
  tbody tr:last-child td { border-bottom: 0; }

  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  th.num { text-align: right; }
  td.null { color: #b4bfd4; font-style: italic; }

  /* ---------- 错误 ---------- */
  .alert {
    display: flex;
    gap: 11px;
    padding: 13px 15px;
    border-radius: 10px;
    background: #fef3f2;
    border: 1px solid #fecdca;
    color: #b42318;
    font-size: 13.5px;
    line-height: 1.65;
    word-break: break-word;
  }

  .alert strong { display: block; margin-bottom: 2px; }

  .meta-line {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 12px;
  }

  .meta-line b { color: var(--ink); font-weight: 600; }

  footer {
    margin-top: 22px;
    text-align: center;
    font-size: 12px;
    color: #a9b4c9;
  }

  code.inline {
    background: #f2f5fb;
    border-radius: 5px;
    padding: 1px 6px;
    font-size: 12px;
    color: #46567a;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="logo">掌</div>
    <div class="title">
      <h1>SmartDataQuery · 智能数据查询</h1>
      <p>用自然语言提问，自动完成元数据召回、SQL 生成与执行</p>
    </div>
  </header>

  <section class="asker">
    <div class="input-row">
      <textarea id="query" rows="1"
        placeholder="请输入你的问题，例如：统计各地区销量排行前三的商品"></textarea>
      <button class="send" id="send">
        <span class="spinner"></span>
        <span class="label">查询</span>
      </button>
    </div>
    <div class="examples">
      <span class="label">示例：</span>
      <button class="chip">统计各地区销量排行前三的商品</button>
      <button class="chip">统计去年各地区的销售总额</button>
      <button class="chip">各品类的平均订单金额</button>
      <button class="chip">每种会员等级的客户数量</button>
    </div>
  </section>

  <div class="grid">

    <aside class="card">
      <div class="card-head">
        <h2>执行进度</h2>
        <span class="badge" id="stageBadge">待开始</span>
      </div>
      <ol class="steps" id="steps"></ol>
    </aside>

    <main class="card">
      <div class="card-head">
        <h2>查询结果</h2>
        <span class="badge" id="resultBadge">—</span>
      </div>
      <div class="result-body" id="resultBody">
        <div class="empty">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="4" width="18" height="16" rx="2"></rect>
            <path d="M3 9h18M9 9v11"></path>
          </svg>
          <div>还没有查询结果</div>
          <div>在上方输入你的问题，或点击一个示例开始</div>
        </div>
      </div>
    </main>

  </div>

  <footer>接口：<code class="inline">POST /api/query</code> · SSE 流式推送执行进度与查询结果</footer>
</div>

<script>
(function () {
  "use strict";

  // 与后端节点顺序保持一致
  var STEPS = [
    "抽取关键字",
    "召回字段",
    "召回指标",
    "召回字段取值",
    "合并召回信息",
    "过滤指标",
    "过滤表格",
    "添加额外上下文信息",
    "生成 SQL",
    "验证 SQL",
    "执行 SQL"
  ];

  var queryEl = document.getElementById("query");
  var sendEl = document.getElementById("send");
  var sendLabel = sendEl.querySelector(".label");
  var stepsEl = document.getElementById("steps");
  var stageBadge = document.getElementById("stageBadge");
  var resultBody = document.getElementById("resultBody");
  var resultBadge = document.getElementById("resultBadge");

  var stepNodes = {};
  var running = false;

  /* ---------------- 步骤区 ---------------- */

  function buildSteps() {
    stepsEl.innerHTML = "";
    stepNodes = {};
    STEPS.forEach(function (name) {
      var li = document.createElement("li");
      li.dataset.state = "pending";

      var dot = document.createElement("span");
      dot.className = "dot";

      var txt = document.createElement("span");
      txt.className = "txt";
      txt.textContent = name;

      li.appendChild(dot);
      li.appendChild(txt);
      stepsEl.appendChild(li);
      stepNodes[name] = li;
    });
  }

  function setStep(name, status) {
    var li = stepNodes[name];
    if (!li) return; // 后端新增了未知节点，忽略即可
    li.dataset.state = status;
    li.classList.remove("running", "success", "error");
    li.classList.add(status);

    var dot = li.querySelector(".dot");
    if (status === "success") dot.textContent = "✓";
    else if (status === "error") dot.textContent = "!";
    else dot.textContent = "";
  }

  /* ---------------- 结果区 ---------------- */

  function showEmpty(title, sub) {
    resultBody.innerHTML = "";
    var box = document.createElement("div");
    box.className = "empty";
    var t = document.createElement("div");
    t.textContent = title;
    var s = document.createElement("div");
    s.textContent = sub || "";
    box.appendChild(t);
    box.appendChild(s);
    resultBody.appendChild(box);
  }

  function showError(msg) {
    resultBody.innerHTML = "";
    var box = document.createElement("div");
    box.className = "alert";
    var icon = document.createElement("div");
    icon.textContent = "⚠";
    var body = document.createElement("div");
    var strong = document.createElement("strong");
    strong.textContent = "查询失败";
    body.appendChild(strong);
    body.appendChild(document.createTextNode(msg || "未知错误"));
    box.appendChild(icon);
    box.appendChild(body);
    resultBody.appendChild(box);
    resultBadge.textContent = "失败";
  }

  function isNumeric(v) {
    if (v === null || v === undefined || v === "") return false;
    if (typeof v === "number") return true;
    return /^-?\d+(\.\d+)?$/.test(String(v).trim());
  }

  function showResult(rows, elapsed) {
    resultBody.innerHTML = "";
    resultBadge.textContent = rows.length + " 行";

    if (!rows.length) {
      showEmpty("查询成功，但没有匹配的数据", "可以换一种问法再试试");
      resultBadge.textContent = "0 行";
      return;
    }

    // 列顺序取所有行 key 的并集，保持首次出现顺序
    var cols = [];
    var seen = Object.create(null);
    rows.forEach(function (row) {
      Object.keys(row).forEach(function (k) {
        if (!seen[k]) { seen[k] = true; cols.push(k); }
      });
    });

    var meta = document.createElement("div");
    meta.className = "meta-line";
    var spanRows = document.createElement("span");
    spanRows.innerHTML = "共 <b>" + rows.length + "</b> 行";
    var spanCols = document.createElement("span");
    spanCols.innerHTML = "字段 <b>" + cols.length + "</b> 个";
    meta.appendChild(spanRows);
    meta.appendChild(spanCols);
    if (elapsed) {
      var spanTime = document.createElement("span");
      spanTime.innerHTML = "耗时 <b>" + (elapsed / 1000).toFixed(1) + "</b> 秒";
      meta.appendChild(spanTime);
    }
    resultBody.appendChild(meta);

    // 判断整体数值列（用于右对齐）
    var numericCol = Object.create(null);
    cols.forEach(function (c) {
      var vals = rows.map(function (r) { return r[c]; })
                     .filter(function (v) { return v !== null && v !== undefined && v !== ""; });
      numericCol[c] = vals.length > 0 && vals.every(isNumeric);
    });

    var scroll = document.createElement("div");
    scroll.className = "table-scroll";

    var table = document.createElement("table");

    var thead = document.createElement("thead");
    var trh = document.createElement("tr");
    cols.forEach(function (c) {
      var th = document.createElement("th");
      th.textContent = c;
      if (numericCol[c]) th.className = "num";
      trh.appendChild(th);
    });
    thead.appendChild(trh);
    table.appendChild(thead);

    var tbody = document.createElement("tbody");
    rows.forEach(function (row) {
      var tr = document.createElement("tr");
      cols.forEach(function (c) {
        var td = document.createElement("td");
        var v = row[c];
        if (v === null || v === undefined) {
          td.textContent = "NULL";
          td.className = "null";
        } else {
          td.textContent = String(v);
          if (numericCol[c]) td.classList.add("num");
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    scroll.appendChild(table);
    resultBody.appendChild(scroll);
  }

  /* ---------------- SSE 解析 ---------------- */

  function handleFrame(raw) {
    var line = raw.trim();
    if (!line || line.indexOf("data:") !== 0) return;

    var payload = line.slice(5).trim();
    if (!payload) return;

    var data;
    try {
      data = JSON.parse(payload);
    } catch (e) {
      return;
    }

    if (data.type === "progress") {
      setStep(data.step, data.status === "running" ? "running"
                     : data.status === "success" ? "success" : "error");
      if (data.status === "running") {
        stageBadge.textContent = data.step;
      }
      return;
    }

    if (data.type === "result") {
      pendingResult = data.data || [];
      return;
    }

    if (data.type === "error") {
      pendingError = data.message || "未知错误";
    }
  }

  var pendingResult = null;
  var pendingError = null;

  /* ---------------- 发送请求 ---------------- */

  function setBusy(busy) {
    running = busy;
    sendEl.disabled = busy;
    sendEl.classList.toggle("loading", busy);
    sendLabel.textContent = busy ? "查询中" : "查询";
  }

  async function submit() {
    var q = queryEl.value.trim();
    if (!q || running) return;

    setBusy(true);
    buildSteps();
    pendingResult = null;
    pendingError = null;
    stageBadge.textContent = "执行中";
    resultBadge.textContent = "—";
    showEmpty("正在查询…", "请稍候，执行进度会实时显示在左侧");

    var startedAt = Date.now();

    try {
      var resp = await fetch("/api/query", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: q })
      });

      if (!resp.ok || !resp.body) {
        throw new Error("接口返回异常：HTTP " + resp.status);
      }

      var reader = resp.body.getReader();
      var decoder = new TextDecoder("utf-8");
      var buffer = "";

      while (true) {
        var chunk = await reader.read();
        if (chunk.done) break;

        buffer += decoder.decode(chunk.value, { stream: true });

        var idx;
        while ((idx = buffer.indexOf("\n\n")) !== -1) {
          handleFrame(buffer.slice(0, idx));
          buffer = buffer.slice(idx + 2);
        }
      }

      if (buffer.trim()) handleFrame(buffer);

      var elapsed = Date.now() - startedAt;

      if (pendingError) {
        stageBadge.textContent = "失败";
        showError(pendingError);
      } else if (pendingResult) {
        stageBadge.textContent = "已完成";
        showResult(pendingResult, elapsed);
      } else {
        stageBadge.textContent = "已完成";
        showEmpty("查询成功，但没有返回数据", "");
        resultBadge.textContent = "0 行";
      }
    } catch (err) {
      stageBadge.textContent = "失败";
      showError(err && err.message ? err.message : String(err));
    } finally {
      setBusy(false);
    }
  }

  /* ---------------- 事件绑定 ---------------- */

  sendEl.addEventListener("click", submit);

  queryEl.addEventListener("keydown", function (e) {
    // Enter 发送，Shift+Enter 换行
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      submit();
    }
  });

  // 输入框自适应高度
  queryEl.addEventListener("input", function () {
    queryEl.style.height = "auto";
    queryEl.style.height = Math.min(queryEl.scrollHeight, 180) + "px";
  });

  Array.prototype.forEach.call(
    document.querySelectorAll(".chip"),
    function (chip) {
      chip.addEventListener("click", function () {
        queryEl.value = chip.textContent.trim();
        queryEl.focus();
      });
    }
  );

  buildSteps();
})();
</script>
</body>
</html>

# =============================================================================
# SmartDataQuery · 应用配置
#
# 敏感信息（数据库密码、LLM API Key 等）通过环境变量注入，
# 配置文件中仅保留 ${ENV_VAR:默认值} 形式的占位符，禁止写入真实密钥。
#
# 本地开发：复制项目根目录的 .env.example 为 .env 并填写真实值，
#           .env 已被 .gitignore 忽略，不会进入版本库。
# 部署环境：直接设置同名环境变量即可覆盖默认值。
# =============================================================================

# =============================================================================
# 日志系统配置
# file:   文件日志输出配置
#   enable:   是否启用文件日志
#   level:    日志级别（DEBUG/INFO/WARNING/ERROR）
#   path:     日志文件存储目录
#   rotation: 日志轮转策略（如按大小 "10 MB" 轮转）
#   retention:日志保留期限（如 "7 days"）
# console: 控制台日志输出配置
#   enable:   是否启用控制台日志
#   level:    日志级别（DEBUG/INFO/WARNING/ERROR）
# =============================================================================
logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

# =============================================================================
# 元数据库连接配置
# host:     数据库主机地址
# port:     数据库服务端口
# user:     登录用户名
# password: 登录密码（通过环境变量 META_DB_PASSWORD 注入）
# database: 目标数据库名称
# =============================================================================
db_meta:
  host: ${META_DB_HOST:127.0.0.1}
  port: ${META_DB_PORT:3306}
  user: ${META_DB_USER:root}
  password: ${META_DB_PASSWORD:}
  database: meta

# =============================================================================
# 数据仓库（DW）数据库连接配置
# host:     数据库主机地址
# port:     数据库服务端口
# user:     登录用户名
# password: 登录密码（通过环境变量 DW_DB_PASSWORD 注入）
# database: 目标数据库名称
# =============================================================================
db_dw:
  host: ${DW_DB_HOST:127.0.0.1}
  port: ${DW_DB_PORT:3306}
  user: ${DW_DB_USER:root}
  password: ${DW_DB_PASSWORD:}
  database: dw

# =============================================================================
# Qdrant 向量数据库连接配置
# host:           Qdrant 服务主机地址
# port:           Qdrant 服务端口
# embedding_size: 向量嵌入维度大小
# =============================================================================
qdrant:
  host: ${QDRANT_HOST:127.0.0.1}
  port: ${QDRANT_PORT:6333}
  embedding_size: 1024

# =============================================================================
# 文本嵌入模型服务连接配置
# host:     嵌入模型服务主机地址
# port:     嵌入模型服务端口
# model:    使用的嵌入模型名称
# base_url: 嵌入服务 OpenAI 兼容接口地址
# api_key:  嵌入服务访问密钥（TEI 本地部署通常无需鉴权）
# =============================================================================
embedding:
  host: ${EMBEDDING_HOST:127.0.0.1}
  port: ${EMBEDDING_PORT:8081}
  model: bge-large-zh-v1.5
  base_url: ${EMBEDDING_BASE_URL:http://127.0.0.1:8081/v1}
  api_key: ${EMBEDDING_API_KEY:EMPTY}
  batch_size: 32

# =============================================================================
# Elasticsearch 搜索服务连接配置
# host:       ES 服务主机地址
# port:       ES 服务端口
# index_name: 默认操作的索引名称
# =============================================================================
es:
  host: ${ES_HOST:127.0.0.1}
  port: ${ES_PORT:9200}
  index_name: data_agent

# =============================================================================
# 大语言模型 API 调用配置
# model_name: 模型名称标识
# api_key:    API 认证密钥（通过环境变量 LLM_API_KEY 注入）
# base_url:   API 服务基础地址
# =============================================================================
llm:
  model_name: ${LLM_MODEL_NAME:deepseek-v4-flash}
  api_key: ${LLM_API_KEY:}
  base_url: ${LLM_BASE_URL:https://api.deepseek.com}
